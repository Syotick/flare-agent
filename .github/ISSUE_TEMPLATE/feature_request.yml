name: ✨ 功能/能力建议
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议尽量具体，说明使用场景与验收标准，便于评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 使用场景 / 痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他做法
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（可选）
      description: 怎样算做完了？
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - agent-runtime（编排引擎）
        - rag（知识库/检索）
        - tools-mcp（工具/MCP）
        - model-gateway（模型网关）
        - web（前端）
        - infra（部署/CI/CD/观测）
        - docs
        - other
