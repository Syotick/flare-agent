apiVersion: apps/v1
kind: Deployment
metadata:
  name: flare-agent
  namespace: flare-agent
  labels:
    app: flare-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flare-agent
  template:
    metadata:
      labels:
        app: flare-agent
    spec:
      containers:
        - name: flare-agent
          image: registry.cn-hangzhou.aliyuncs.com/<namespace>/flare-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: flare-agent-config
            - secretRef:
                name: flare-agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
